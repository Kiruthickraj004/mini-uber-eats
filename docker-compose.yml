services:

  postgres:
    image: postgres:17
    container_name: mini_uber_eats_postgres
    environment:
      POSTGRES_DB: uber_eats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kira@004
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: mini_uber_eats_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: